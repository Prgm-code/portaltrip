# Production stack for Coolify (or any host with its own reverse proxy).
# Same services as compose.yml but without host port bindings: Coolify assigns the
# domain to the "app" service and routes it to container port 8080 through its proxy.
# In Coolify: New resource -> Docker Compose -> this repository -> file: compose.coolify.yml
# Required environment variables: JWT_SECRET_BASE64, DB_PASSWORD, APP_CORS_ALLOWED_ORIGINS.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rickandmorty}
      DB_USER: ${DB_USER:-rick}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_TTL: ${JWT_TTL:-PT30M}
      JWT_ISSUER: ${JWT_ISSUER:-https://portaltrip.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-portaltrip-api}
      REGISTRATION_CREDIT: ${REGISTRATION_CREDIT:-5000.00}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rickandmorty}
      POSTGRES_USER: ${DB_USER:-rick}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The official image runs these .sql files automatically the first time the volume is created.
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./db/app-schema.sql:/docker-entrypoint-initdb.d/02-app-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
