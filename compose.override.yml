# Local development only. Docker Compose merges this file automatically when you run
# `docker compose up` without -f. Coolify and other hosts that pass `-f compose.yml`
# ignore it, so no host ports are published on a server and nothing conflicts.
services:
  app:
    ports:
      - "${SERVER_PORT:-8080}:8080"

  postgres:
    ports:
      # Publishes the database on localhost:5432 for ./mvnw spring-boot:run and SQL clients.
      - "${DB_PORT:-5432}:5432"
