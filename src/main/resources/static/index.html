<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Portaltrip · healthcheck</title>
	<style>
		:root {
			--ink: #1c1917;
			--muted: #57534e;
			--paper: #f5f0e8;
			--card: #fffcf7;
			--line: #e7e0d4;
			--up: #3f6f4a;
			--up-bg: #e4f0e5;
			--down: #9b2c2c;
			--down-bg: #fde8e8;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem 1.25rem;
			background: var(--paper);
			color: var(--ink);
			font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
		}

		main {
			width: min(36rem, 100%);
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 2rem 2.25rem 1.75rem;
		}

		p.brand {
			margin: 0 0 0.35rem;
			font-size: 0.8rem;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: var(--muted);
			font-family: ui-sans-serif, system-ui, sans-serif;
		}

		h1 {
			margin: 0 0 1.5rem;
			font-size: 1.75rem;
			font-weight: 600;
		}

		.status {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.35rem 0.75rem;
			border-radius: 999px;
			font-family: ui-sans-serif, system-ui, sans-serif;
			font-size: 0.85rem;
			font-weight: 650;
			letter-spacing: 0.04em;
			background: var(--up-bg);
			color: var(--up);
		}

		.status.down {
			background: var(--down-bg);
			color: var(--down);
		}

		.status::before {
			content: "";
			width: 0.55rem;
			height: 0.55rem;
			border-radius: 50%;
			background: currentColor;
		}

		dl {
			margin: 1.5rem 0 0;
			display: grid;
			grid-template-columns: 8rem 1fr;
			gap: 0.65rem 1rem;
			font-family: ui-sans-serif, system-ui, sans-serif;
			font-size: 0.92rem;
		}

		dt {
			margin: 0;
			color: var(--muted);
		}

		dd {
			margin: 0;
			font-variant-numeric: tabular-nums;
		}

		a {
			color: var(--ink);
		}
	</style>
</head>
<body>
	<main>
		<p class="brand">Portaltrip</p>
		<h1>Healthcheck</h1>
		<p id="badge" class="status">EN LÍNEA</p>
		<dl>
			<dt>Aplicación</dt>
			<dd id="app">portaltrip</dd>
			<dt>Estado</dt>
			<dd id="status">UP</dd>
			<dt>Marca de tiempo</dt>
			<dd id="timestamp">cargando…</dd>
			<dt>JSON</dt>
			<dd><a href="/health">/health</a></dd>
		</dl>
	</main>
	<script>
		const badge = document.getElementById("badge");
		const app = document.getElementById("app");
		const status = document.getElementById("status");
		const timestamp = document.getElementById("timestamp");

		function showDown() {
			badge.textContent = "SIN RESPUESTA";
			badge.classList.add("down");
			status.textContent = "DOWN";
			timestamp.textContent = new Date().toISOString();
		}

		fetch("/health")
			.then((response) => {
				if (!response.ok) {
					throw new Error("healthcheck failed");
				}
				return response.json();
			})
			.then((data) => {
				app.textContent = data.application ?? "portaltrip";
				status.textContent = data.status ?? "UP";
				timestamp.textContent = data.timestamp ?? new Date().toISOString();
				if (data.status !== "UP") {
					badge.textContent = "CON PROBLEMAS";
					badge.classList.add("down");
				}
			})
			.catch(showDown);
	</script>
</body>
</html>
