spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rickandmorty}
    username: ${DB_USER:rick}
    password: ${DB_PASSWORD:morty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

app:
  security:
    jwt:
      # HS256 key for local development only; lets the app start without environment variables.
      # The prod profile has no default and requires JWT_SECRET_BASE64.
      secret: ${JWT_SECRET_BASE64:cG9ydGFsdHJpcC1kZXYtb25seS1qd3Qtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZA==}
