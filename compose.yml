services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portaltrip-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rickandmorty}
      DB_USER: ${DB_USER:-rick}
      DB_PASSWORD: ${DB_PASSWORD:-morty}
    ports:
      - '${SERVER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: portaltrip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rickandmorty}
      POSTGRES_USER: ${DB_USER:-rick}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-morty}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # La imagen oficial ejecuta automáticamente los .sql de este directorio
      # la primera vez que se inicializa el volumen de datos.
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./db/app-schema.sql:/docker-entrypoint-initdb.d/02-app-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
